spring: # test profile
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id:
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/oauth2/code/kakao"

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  datasource:
    url: "jdbc:h2:mem:Code2CV"
    username: "sa"
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true # SQL 포맷팅
        highlight_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host:
      port:

logging.level:
  org.hibernate:
    orm.jdbc.bind: trace
    SQL: debug

jwt:
  secret:
  access-token-expire-time: 1800000 # 30 minutes
  refresh-token-expire-time: 2592000000 # 30 days

management:
  endpoints:
    web:
      exposure: # 외부에 노출할 엔드포인트
        include: prometheus, health, info, swagger-ui
  metrics:
    tags:
      application: "katecam" # 메트릭 데이터에태그를 추가
cloud:
  aws:
    s3:
      bucket: katecam
    credentials:
      access-key:
      secret-key:
    region:
      static: ap-northeast-2
    stack:
      auto: false

